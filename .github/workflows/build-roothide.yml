name: Build MUBX (roothide + rootless)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: mubx-roothide-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: MUBX packages (roothide + rootless)
    runs-on: macos-15

    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup RootHide Theos
        uses: waruhachi/theos-action@v2.4.6
        with:
          theos-src: roothide/theos
          sdks-src: xybp888/iOS-SDKs

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          test -d "${THEOS}"
          test -d "${THEOS}/sdks/iPhoneOS16.5.sdk"
          test -x "${THEOS}/bin/ldid" || command -v ldid
          xcodebuild -version
          make --version | head -n 1
          bash -n build.sh
          echo "Using THEOS=${THEOS}"

      - name: Build package
        shell: bash
        env:
          THEOS_PACKAGE_SCHEME: roothide
        run: |
          set -euo pipefail
          ./build.sh

      - name: Verify and rename packages
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          
          # 获取版本号（从标签或使用默认值）
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            VERSION="latest"
          fi
          
          for scheme in roothide rootless; do
            # Scheme 标签首字母大写（bash 3.2 兼容，不能用 ${var^}）
            if [ "$scheme" = "roothide" ]; then
              scheme_label="RootHide"
            else
              scheme_label="Rootless"
            fi
            for ios in ios16 ios17; do
              packages=(packages/$scheme/$ios/*.deb)
              if (( ${#packages[@]} != 1 )); then
                echo "Expected exactly one $scheme/$ios package, found ${#packages[@]}." >&2
                exit 1
              fi
              package="${packages[0]}"
              test -s "$package"
              
              # 重命名为更清晰的格式
              new_name="MUBX-${scheme_label}-${ios}-${VERSION}.deb"
              mv "$package" "packages/$scheme/$ios/$new_name"
              echo "Package: packages/$scheme/$ios/$new_name"
            done
          done

      - name: Upload roothide iOS 16 Debian package
        uses: actions/upload-artifact@v4
        with:
          name: mubx-roothide-ios16
          path: packages/roothide/ios16/*.deb
          if-no-files-found: error
          retention-days: 14

      - name: Upload roothide iOS 17 Debian package
        uses: actions/upload-artifact@v4
        with:
          name: mubx-roothide-ios17
          path: packages/roothide/ios17/*.deb
          if-no-files-found: error
          retention-days: 14

      - name: Upload rootless iOS 16 Debian package
        uses: actions/upload-artifact@v4
        with:
          name: mubx-rootless-ios16
          path: packages/rootless/ios16/*.deb
          if-no-files-found: error
          retention-days: 14

      - name: Upload rootless iOS 17 Debian package
        uses: actions/upload-artifact@v4
        with:
          name: mubx-rootless-ios17
          path: packages/rootless/ios17/*.deb
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          
          # 查找所有 .deb 文件
          deb_files=(release-assets/*/*.deb)
          
          if (( ${#deb_files[@]} < 4 )); then
            echo "Expected at least four Debian packages, found ${#deb_files[@]}." >&2
            exit 1
          fi
          
          # 复制到根目录，使用有意义的文件名
          for package in "${deb_files[@]}"; do
            # 获取父目录名作为标识符
            dir_name="$(basename "$(dirname "$package")")"
            base_name="$(basename "$package")"
            # 如果文件名中没有版本号，从标签获取
            if [[ ! "$base_name" =~ \.v?[0-9]+\.[0-9]+\.[0-9]+\.deb$ ]]; then
              version="${GITHUB_REF_NAME#v}"
              # 构建新文件名，保持原文件名的可读性
              if [[ "$base_name" =~ MUBX-(RootHide|Rootless)-(ios[0-9]+)-.*\.deb$ ]]; then
                scheme_label="${BASH_REMATCH[1]}"
                ios="${BASH_REMATCH[2]}"
                new_name="MUBX-${scheme_label}-${ios}-${version}.deb"
              else
                # 如果原文件名不符合预期，使用目录名
                new_name="${dir_name}-${base_name}"
              fi
              cp "$package" "release-assets/$new_name"
            else
              # 如果已经有版本号，直接复制
              cp "$package" "release-assets/$base_name"
            fi
          done
          
          echo "Final release assets:"
          ls -l release-assets/*.deb

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          
          tag="${GITHUB_REF_NAME}"
          assets=(release-assets/*.deb)
          
          # 确保有资源要上传
          if [ ${#assets[@]} -eq 0 ]; then
            echo "Error: No assets found to upload!" >&2
            exit 1
          fi
          
          echo "Tag: $tag"
          echo "Assets to upload: ${assets[@]}"
          
          # 检查发布版本是否存在，然后创建或更新
          if gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Updating existing release: $tag"
            gh release upload "$tag" "${assets[@]}" --repo "$GH_REPO" --clobber
          else
            echo "Creating new release: $tag"
            gh release create "$tag" "${assets[@]}" --repo "$GH_REPO" \
              --title "MUBX $tag" \
              --generate-notes
          fi
          
          echo "Release published successfully!"

  # 可选：添加一个 job 来创建预发布版本
  prerelease:
    name: Create Prerelease for main branch
    #if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    if: false  # 跳过此 job
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Prepare assets for prerelease
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for package in release-assets/*/*.deb; do
            dir_name="$(basename "$(dirname "$package")")"
            base_name="$(basename "$package")"
            cp "$package" "release-assets/prerelease-${dir_name}-${base_name}"
          done
          ls -l release-assets/*.deb

      - name: Create or update prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          prerelease_tag="main-latest"
          assets=(release-assets/*.deb)
          
          if gh release view "$prerelease_tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$prerelease_tag" "${assets[@]}" --repo "$GH_REPO" --clobber
          else
            gh release create "$prerelease_tag" "${assets[@]}" --repo "$GH_REPO" \
              --title "MUBX Development Build" \
              --prerelease \
              --generate-notes
          fi
